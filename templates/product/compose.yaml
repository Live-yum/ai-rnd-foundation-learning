services:
  database:
    image: postgres:17
    environment:
      POSTGRES_USER: product
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated by start.py}
      POSTGRES_DB: product
    ports:
      - "127.0.0.1:${PG_PORT:-55432}:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U product -d product"]
      interval: 2s
      timeout: 3s
      retries: 45
volumes:
  database:
