name: Prepare local-only toolchain (temporary)
on:
  push:
    branches: [feat/controlled-toolchain-integration]
    paths: ['.maintenance/**', '.github/workflows/prepare-local-tools.yml']
permissions:
  contents: write
concurrency:
  group: prepare-local-source-v2
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact reviewed sources and verified upstream component
        run: python .maintenance/apply.py
      - name: Resolve locked local dependencies
        run: |
          uv lock
          uv sync --locked --all-extras
          uv sync --locked --project tools/aider --python 3.12
          npm install --package-lock-only --prefix tools/node --ignore-scripts --no-audit --no-fund
          npm ci --prefix tools/node --no-audit --no-fund
          npm run build --prefix tools/node
          git add tools/node/package-lock.json
      - name: Validate complete final-state textbook
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          uv run python -m scripts.build_handbook
          uv run python -m scripts.build_handbook --check
      - name: Commit materialized source and single handbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'feat: actual Continue indexing, offline Aider and smart-to-Daytona delivery acceptance'
            git push origin HEAD:feat/controlled-toolchain-integration
          fi
      - name: Platform and actual local toolchain verification
        env:
          RND_REQUIRE_NODE_TESTS: '1'
        run: |
          uv run pytest -m 'not postgres' -q --junitxml=reports/tests.xml
          uv run python -m scripts.ci_toolchain
      - name: Reconstruct and test from only the handbook
        run: uv run python -m scripts.ci_handbook
      - name: Archive exact materialized source
        if: always()
        run: |
          mkdir -p reports
          git archive --format=zip HEAD -o reports/review-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-continue-reviewed-source
          path: |
            reports/*.json
            reports/*.xml
            reports/review-source.zip
# One-time reviewed source synchronization; removed from the final PR tree.
