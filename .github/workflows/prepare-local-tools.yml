name: Prepare local-only toolchain (temporary)
on:
  push:
    branches: [feat/controlled-toolchain-integration]
    paths: ['.maintenance/**', '.github/workflows/prepare-local-tools.yml']
permissions:
  contents: write
concurrency:
  group: prepare-local-source-v2
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Materialize reviewed source against exact preimages
        if: hashFiles('.maintenance/local.patch') != ''
        run: |
          sed -i 's/^ diff --git /diff --git /' .maintenance/local.patch
          git apply --recount --check --index .maintenance/local.patch
          git apply --recount --index .maintenance/local.patch
          rm .maintenance/local.patch
      - name: Materialize complete tutorial against SHA-checked preimages
        if: hashFiles('.maintenance/docs.py') != ''
        run: python .maintenance/docs.py
      - name: Resolve and validate pinned runtimes
        run: |
          uv lock
          uv sync --locked --all-extras
          uv sync --locked --project tools/aider --python 3.12
          uv run ruff check --fix .
          uv run ruff format .
          uv run python -m scripts.build_handbook
          uv run python -m scripts.build_handbook --check
      - name: Archive public installed Python dependencies for independent review
        run: |
          uv run python - <<'PYTHON'
          import pathlib, sys, tarfile
          target = pathlib.Path('reports/review-runtime'); target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(target / 'platform-runtime.tar.gz', 'w:gz') as archive:
              archive.add(sys.base_prefix, arcname='python', filter=lambda item: None if '__pycache__' in item.name else item)
              archive.add(pathlib.Path(sys.prefix) / 'lib/python3.14/site-packages', arcname='site-packages', filter=lambda item: None if '__pycache__' in item.name else item)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: platform-runtime-for-review
          path: reports/review-runtime/platform-runtime.tar.gz
          retention-days: 3
      - name: Commit generated source and single handbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'fix: bounded Daytona SDK report streaming with contract tests and handbook'
            git push origin HEAD:feat/controlled-toolchain-integration
          fi
      - name: Platform and real local toolchain verification
        run: |
          uv run pytest -m 'not postgres' -q --junitxml=reports/tests.xml
          uv run python -m scripts.ci_toolchain
      - name: Reconstruct the project using only the handbook
        run: uv run python -m scripts.ci_handbook
      - name: Archive exact materialized source
        if: always()
        run: |
          mkdir -p reports
          git archive --format=zip HEAD -o reports/review-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-only-reviewed-source
          path: |
            reports/*.json
            reports/*.xml
            reports/review-source.zip
