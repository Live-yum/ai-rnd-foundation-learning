name: Prepare local-only toolchain (temporary)
on:
  push:
    branches: [feat/controlled-toolchain-integration]
    paths: ['.maintenance/**', '.github/workflows/prepare-local-tools.yml']
permissions:
  contents: write
concurrency:
  group: prepare-local-tools
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Materialize reviewed source against exact preimages
        if: hashFiles('.maintenance/local.patch') != ''
        run: |
          sed -i 's/^ diff --git /diff --git /' .maintenance/local.patch
          git apply --recount --check --index .maintenance/local.patch
          git apply --recount --index .maintenance/local.patch
          rm .maintenance/local.patch
      - name: Materialize complete tutorial against SHA-checked preimages
        if: hashFiles('.maintenance/docs.py') != ''
        run: python .maintenance/docs.py
      - name: Resolve and validate pinned runtimes
        run: |
          uv lock
          uv sync --locked --all-extras
          uv sync --locked --project tools/aider --python 3.12
          uv run ruff check --fix .
          uv run ruff format .
          uv run python -m scripts.build_handbook
          uv run python -m scripts.build_handbook --check
      - name: Commit generated source and single handbook
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'build: synchronize local-only runtimes and complete from-zero handbook'
            git push origin HEAD:feat/controlled-toolchain-integration
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Platform and real local toolchain verification
        run: |
          uv run pytest -m 'not postgres' -q --junitxml=reports/tests.xml
          uv run python -m scripts.ci_toolchain
      - name: Reconstruct the project using only the handbook
        run: uv run python -m scripts.ci_handbook
      - name: Archive exact materialized source
        if: always()
        run: |
          mkdir -p reports
          git archive --format=zip HEAD -o reports/review-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-only-reviewed-source
          path: reports/
  local-daytona:
    needs: prepare
    if: always() && needs.prepare.outputs.sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/daytona-local.yml
    with:
      source-ref: ${{ needs.prepare.outputs.sha }}
