name: Rebuild complete handbook on dedicated branch
on:
  push:
    branches: [feat/customer-service-acceptance]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.repository == 'Live-yum/ai-rnd-foundation-learning' && github.ref == 'refs/heads/feat/customer-service-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Verify exact branch head, remove one-time helper, rebuild final textbook
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PARENT: d58029b740e0349285c74cf749ed2486a1c09f48
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/customer-service-acceptance
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          git fetch origin feat/customer-service-acceptance
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git rm .github/workflows/customer-handbook-once.yml
          uv run --no-project --python 3.14 python -m scripts.build_handbook
          uv run --no-project --python 3.14 python -m scripts.build_handbook --check
          git add -- '从零实现AI研发平台_逐步实操手册_完整版.md'
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0'))
          assert changed <= {'.github/workflows/customer-handbook-once.yml','从零实现AI研发平台_逐步实操手册_完整版.md'}, changed
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: regenerate final standalone handbook from accepted source'
          git push origin HEAD:refs/heads/feat/customer-service-acceptance
