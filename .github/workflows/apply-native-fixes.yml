name: Apply reviewed native runtime fixes
on:
  push:
    branches: [feat/python314-workbench]
    paths: [.github/workflows/apply-native-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python314-workbench
      - name: Apply reviewed patch with context checks
        run: |
          git apply --check .maintenance/native-runtime-fixes.patch
          git apply .maintenance/native-runtime-fixes.patch
          git rm .maintenance/native-runtime-fixes.patch .maintenance/apply_native_patch.py .maintenance/native_pg_fix.py
          git rm .github/workflows/apply-reviewed-native.yml .github/workflows/format-native-handbook.yml .github/workflows/native-source-review.yml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m scripts.build_handbook
      - run: uv run pytest -m 'not postgres' -q --junitxml=reports/regression.xml
      - name: Commit tested source and exact handbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbench tests scripts .github/workflows/native-runtime.yml 从零实现AI研发平台_逐步实操手册_完整版_v3.md
          git commit -m 'fix: integrate native transaction and build diagnostics with regression-tested handbook'
          git push origin HEAD:feat/python314-workbench
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-fixes-regression
          path: reports/
