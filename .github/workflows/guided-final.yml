name: Guided final browser and handbook
on:
  push:
    branches: [diagnostics/guided-workbench]
    paths: [.reviewed/finalize_files.py, .reviewed/final-docs.*, .github/workflows/guided-final.yml]
permissions:
  contents: read
concurrency:
  group: guided-final
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/guided-workbench
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: python .reviewed/finalize_files.py
      - run: uv sync --locked --all-extras
      - name: Format complete tree, regenerate manuals and run full regression
        run: |
          uv run ruff check --fix .
          uv run ruff format .
          uv run python -m scripts.build_handbook
          uv run python -m scripts.build_handbook --check
          uv run pytest -m 'not postgres' --junitxml=reports/tests.xml
      - name: Save actual tested source
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbench templates/product templates/frontends templates/deployment scripts tests migrations docs README.md SECURITY.md .env.example .reviewed '从零实现AI研发平台_逐步实操手册_完整版.md' '从零实现AI研发平台_逐步实操手册_完整版_v3.md'
          if ! git diff --cached --quiet; then git commit -m 'docs: complete reproducible guide and fix real filter reset interaction'; git push origin HEAD:diagnostics/guided-workbench; fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - if: always()
        run: |
          mkdir -p reports
          git archive --format=zip --output=reports/candidate-source.zip HEAD
          git rev-parse HEAD > reports/candidate-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-final-candidate
          path: reports/
          retention-days: 7
  regression:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m scripts.build_handbook --check
      - run: uv run pytest -m 'not postgres' --junitxml=reports/tests.xml
      - run: uv run python -m scripts.ci_clean_install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-final-${{ matrix.os }}
          path: reports/
  browser:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: uv sync --locked --all-extras
      - run: |
          npm install --prefix .native/browser --no-audit --no-fund --package-lock=false playwright@1.56.1
          PLAYWRIGHT_BROWSERS_PATH=0 .native/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: uv run python -m scripts.ci_guided_browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-final-real-browser
          path: reports/
