name: Synchronize native runbook and complete source appendix
on:
  push:
    branches: [feat/python314-workbench]
    paths: [.github/workflows/sync-native-handbook.yml]
permissions:
  contents: write
jobs:
  handbook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python314-workbench
      - run: |
          git apply --check .maintenance/native-guide.patch
          git apply .maintenance/native-guide.patch
          git rm .maintenance/native-guide.patch
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m scripts.build_handbook
      - run: uv run pytest -m 'not postgres' -q
      - name: Commit full reproducible manual
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs 从零实现AI研发平台_逐步实操手册_完整版_v3.md
          git commit -m 'docs: complete native runtime instructions and regenerate exact implementation handbook'
          git push origin HEAD:feat/python314-workbench
