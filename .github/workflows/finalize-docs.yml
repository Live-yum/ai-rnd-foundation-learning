name: Final handbook narrative synchronization (temporary)
on:
  push:
    branches: [feat/controlled-toolchain-integration]
permissions:
  contents: write
jobs:
  handbook:
    if: github.repository == 'Live-yum/ai-rnd-foundation-learning' && github.ref == 'refs/heads/feat/controlled-toolchain-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Correct stale narrative and render the final source inventory
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          path = Path('docs/guide.md')
          text = path.read_text(encoding='utf-8')
          changes = {
              '创建filesystem.py、vendor.py、tools.py、knowledge.py、rules.py、coding.py。': '在workbench目录创建filesystem.py、vendor.py、tools.py、symbols.py、knowledge.py、retrieval.py、context_mcp.py、toolchain.py、rules.py、coding.py、aider_tool.py和sandbox.py，全部内容见源码附录。第20章逐项说明解析、检索、Continue、Aider和Daytona的安装、接线与测试。',
              'vendor读取manifest，核对ZIP整体SHA和解压后的文件指纹与LICENSE。重复init复用有效缓存，篡改立即拒绝。三份模板在仓库内，源码未变化就不反复解析。knowledge的AST索引记录Python符号起止行和imports，Java/TS目前是文件地图，不假称是精确全语言调用图。输出目录必须位于被索引源码之外。': 'vendor读取manifest，核对ZIP整体SHA和解压后的文件指纹与LICENSE。重复init复用有效缓存，篡改立即拒绝。三份模板在仓库内，源码未变化就不反复解析。knowledge记录文件SHA、符号起止行与增量状态；Python使用标准库AST，Java/TypeScript/JavaScript以及Vue内嵌script通过symbols中的Tree-sitter解析。Java类、方法、字段、注解和继承，TS声明，以及Vue组件标签与真实源码行号进入符号索引；这不是完整的跨模块类型推导或调用图，编译和类型检查仍然必需。retrieval提供SQLite FTS5与可选独立授权向量检索，context_mcp向Continue开放只读查询，toolchain把同一上下文接入规划。输出目录必须位于被索引源码之外。',
              '流程节点：analyse → requirements gate → plan → design gate → generate → code（需要时）→ verify → repair（需要时）→ model_review（可选）→ package → delivery gate。状态主要保存runID、版本、结构化规格和回执路径，不保存ZIP字节或整个仓库。': '实际流程节点：analyse → requirements gate → source_context（索引、检索与Repo Map）→ plan → design gate → generate → code（需要时）→ verify；可修复失败经repair回到code，再次verify；验证通过后进入sandbox（已授权时执行Daytona，否则记录未启用）→ model_review（可选）→ package（含独立解压复验）→ delivery gate。source_context不调用聊天模型，也不默认上传向量；code按CODING_ENGINE使用原有受限引擎或真实Aider；sandbox失败不能跳到交付。状态主要保存runID、版本、结构化规格、有界上下文与回执，不保存ZIP字节或整个仓库。',
          }
          for before, after in changes.items():
              if text.count(before) != 1:
                  raise SystemExit('Narrative preimage changed; refusing an ambiguous replacement')
              text = text.replace(before, after, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          helper = Path('.github/workflows/finalize-docs.yml')
          original = helper.read_bytes()
          helper.unlink()
          try:
              subprocess.run([sys.executable, '-m', 'scripts.build_handbook'], check=True)
              subprocess.run([sys.executable, '-m', 'scripts.build_handbook', '--check'], check=True)
          finally:
              helper.write_bytes(original)
          PY
      - name: Publish only the three reviewed document files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/guide.md 从零实现AI研发平台_逐步实操手册_完整版.md 从零实现AI研发平台_逐步实操手册_完整版_v3.md
          git commit -m 'docs: synchronize full handbook narrative with implemented parsing and sandbox gates'
          git push origin HEAD:feat/controlled-toolchain-integration
      - name: Preserve exact materialized source
        run: |
          mkdir reports
          git rev-parse HEAD > reports/commit.txt
          git archive --format=zip HEAD -o reports/review-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: synchronized-handbook-source
          path: reports/
