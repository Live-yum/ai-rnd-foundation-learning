name: Pinned local image diagnostic (temporary)
on:
  push:
    branches: [feat/controlled-toolchain-integration]
    paths: ['.github/workflows/diagnose-local-images.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Anonymous manifest inspection of the fixed release only
        run: |
          python - <<'PY'
          import subprocess
          from concurrent.futures import ThreadPoolExecutor
          refs = ['ghcr.io/daytonaio/daytona-'+part+':v0.190.0' for part in ['api','proxy','runner']]
          refs += ['daytonaio/daytona-'+part+':v0.190.0' for part in ['api','proxy','runner']]
          refs += ['daytonaio/sandbox:0.5.0-slim']
          def inspect(ref):
              p=subprocess.run(['docker','--host','unix:///var/run/docker.sock','manifest','inspect',ref],capture_output=True,text=True,timeout=90)
              return ref,p.returncode,(p.stdout+p.stderr)[:2000]
          for result in ThreadPoolExecutor(max_workers=4).map(inspect,refs):
              print(result,flush=True)
          PY
