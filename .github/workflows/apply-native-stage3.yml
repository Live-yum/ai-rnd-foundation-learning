name: Apply reviewed native frontend lifecycle
on:
  push:
    branches: [feat/python314-workbench]
    paths: [.github/workflows/apply-native-stage3.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python314-workbench
      - run: |
          git apply --check .maintenance/native-stage3.patch
          git apply .maintenance/native-stage3.patch
          git rm .maintenance/native-stage3.patch
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - run: uv run ruff format .
      - run: uv run ruff check .
      - run: uv run python -m scripts.build_handbook
      - run: uv run pytest -m 'not postgres' -q
      - name: Commit tested source and full handbook
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbench scripts tests 从零实现AI研发平台_逐步实操手册_完整版_v3.md
          git commit -m 'fix: stabilize native browser interaction and isolate frontend build lifecycle'
          git push origin HEAD:feat/python314-workbench
