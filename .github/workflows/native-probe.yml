name: Bundled template integrity
on:
  workflow_dispatch:
  pull_request:
    paths: ['templates/vendor/**', 'workbench/vendor.py', '.github/workflows/native-probe.yml']
permissions:
  contents: read
jobs:
  verify-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: uv run pytest tests/test_vendor.py -q
      - run: uv run python -m scripts.ci_native_sources
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundled-template-integrity
          path: reports/
  model-smoke:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Live-yum/ai-rnd-foundation-learning' && github.ref == 'refs/heads/feat/real-model-acceptance'
    environment: rnd
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: User-requested exact DeepSeek Hello request
        env:
          DEEPSEEK_API_KEY: ${{ secrets.APK_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
          MODE: ${{ vars.MODE }}
        run: python3 scripts/ci_model_smoke.py
