name: Apply reviewed native source fixes
on:
  push:
    branches: [feat/python314-workbench]
    paths: [.maintenance/apply_native_patch.py, .maintenance/native_pg_fix.py, .github/workflows/apply-reviewed-native.yml]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/python314-workbench
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: python .maintenance/apply_native_patch.py && python .maintenance/native_pg_fix.py
      - run: uv sync --locked --all-extras
      - run: uv run ruff check --fix workbench scripts tests migrations
      - run: uv run ruff format workbench scripts tests migrations
      - run: uv run python -m scripts.build_handbook
      - run: uv run python -m scripts.build_handbook --check
      - run: uv run pytest -m "not postgres" -q --junitxml=reports/source-tests.xml
      - name: Commit tested source and synchronized handbook on feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workbench scripts tests migrations 从零实现AI研发平台_逐步实操手册_完整版_v3.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: connect tested native runtime delivery and PostgreSQL-compatible generation'
            git push origin HEAD:feat/python314-workbench
          fi
      - name: Export actual working source for review
        if: always()
        run: |
          mkdir -p /tmp/reviewed-native reports
          cp -r workbench scripts tests migrations docs templates .github /tmp/reviewed-native/
          cp pyproject.toml uv.lock alembic.ini README.md SECURITY.md .env.example .gitignore .gitattributes .python-version 从零实现AI研发平台_逐步实操手册_完整版_v3.md /tmp/reviewed-native/
          find /tmp/reviewed-native -name __pycache__ -type d -prune -exec rm -rf {} +
          tar -czf reports/source-review.tar.gz -C /tmp/reviewed-native .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-native-source-fixes
          path: reports/
          retention-days: 7
