name: Temporary feature-branch toolchain preparation
on:
  push:
    branches: [feat/structured-code-tools]
permissions:
  contents: write
concurrency:
  group: prepare-structured-code-tools
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/structured-code-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Materialize only checksum-verified authored source on the feature branch
        shell: python
        run: |
          import base64, bz2, hashlib, subprocess
          from pathlib import Path
          paths = sorted(Path('.').glob('.rnd-toolchain-patch-*.b64'))
          if paths:
              expected = ['5f9f47e59159bfc89ec003463e3633b8ec3fa3c683290ce1a2daef9576f34882','961d583189c3b687905131d3deac80607258cd2fe3a8f29e18a616188c332cfd','5c01dc2c9287b7540b05f021fd80c06c6325bcc076eff6eb436be9ccf1697a64','c288249be68658ea32cef92c655da29bed5ae50ebdf7a9d28a62cc8f6b20a0f7','e3206cede0873e55e9f179b2811da422f5d764f0edbc56f4e1003eb6ff911ce0','3c411cab04fc8dbf3855dfac50d8ab7a27fabadcadc11578ba9f8720c6503332','f97c01c665fd509512b1e79144239dc34f0085195b1447f87f9e504943c648b5']
              assert len(paths) == 7
              parts = [p.read_text().strip() for p in paths]
              assert [hashlib.sha256(p.encode()).hexdigest() for p in parts] == expected
              patch = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
              assert hashlib.sha256(patch).hexdigest() == 'cdd899068fad47dc15113b021f7a157234e3283bc28d40e46125c9ad11eb9b92'
              subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
              for path in paths:
                  path.unlink()
      - name: Resolve platform 3.14 and isolated Aider 3.12 lockfiles
        run: |
          uv lock
          uv lock --project tools/aider --python 3.12
          uv sync --all-extras
      - name: Normalize source and rebuild both complete handbooks
        run: |
          uv run ruff check . --fix
          uv run ruff format .
          uv run python -m scripts.build_handbook
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: integrate structured code tools, resolved locks and complete synchronized handbook'
          git push origin HEAD:feat/structured-code-tools
          git rev-parse HEAD
      - name: Unit and existing local delivery regressions
        run: uv run pytest -m 'not postgres' --junitxml=reports/preflight.xml
      - name: Install real separately locked Aider
        run: uv run rnd tools install-aider
      - name: Real Aider edit-repair-delivery, native indexes and MCP protocol
        run: uv run python -m scripts.ci_toolchain
      - name: Preserve exact tested source for inspection
        if: always()
        run: git archive --format=zip --output=toolchain-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toolchain-preflight-source-and-evidence
          path: |
            toolchain-source.zip
            reports/
