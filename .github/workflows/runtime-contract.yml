name: Verify native Java date imports with the exact approved Plan
on:
  push:
    branches: [feat/customer-service-acceptance]
    paths: [.github/workflows/runtime-contract.yml]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    if: github.repository == 'Live-yum/ai-rnd-foundation-learning' && github.ref == 'refs/heads/feat/customer-service-acceptance' && github.event.before == '003d86d0bcacb647b119edfb48688f46cdc0097a'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: native_codegen
          POSTGRES_USER: native
          POSTGRES_PASSWORD: native-ci-only
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U native -d native_codegen"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['127.0.0.1:6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve only the previously validated synthetic customer Plan
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36766177067
          name: customer-plan-replay-yudao-vben-50b2e7bca6c9244865dc880e20e2c5633584e131
          path: ${{ runner.temp }}/customer-plan
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository
          key: native-maven-central-v2-Linux-47f8f6cfabc5017a8eac4654c7ba4c14aaa6a7be
      - run: npm install --global pnpm@11.16.0
      - name: Allocate the same bounded native-build memory
        run: |
          sudo fallocate -l 8G /mnt/customer-replay.swap
          sudo chmod 600 /mnt/customer-replay.swap
          sudo mkswap /mnt/customer-replay.swap
          sudo swapon /mnt/customer-replay.swap
      - run: uv sync --locked --all-extras
      - name: Verify exact replay inputs without provider access
        env:
          REPLAY_PLAN: ${{ runner.temp }}/customer-plan/approved-plan-replay.json
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          uv run python - <<'PY'
          import hashlib, os
          from pathlib import Path
          from workbench.domain import Plan
          data = Path(os.environ['REPLAY_PLAN']).read_bytes()
          assert len(data) <= 131072
          assert hashlib.sha256(data).hexdigest() == 'dc8c653056be6f68e520668161aa559ba4d3e3325830ad9064922d3f03c743c5'
          plan = Plan.model_validate_json(data)
          assert not plan.custom_rules and not plan.unsupported and plan.business
          assert {e.name for e in plan.entities} == {'customers', 'requests', 'tasks'}
          assert not os.environ.get('API_KEY')
          print('Exact approved customer Plan and immutable source verified; no provider credentials')
          PY
      - name: Install isolated pinned browser tooling
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          npm install --prefix .native/browser --no-audit --no-fund --package-lock=false playwright@1.56.1
          node .native/browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Replay actual Plan through native generation and compilation
        env:
          NATIVE_TEST_DATABASE_URL: postgresql+psycopg://native:native-ci-only@127.0.0.1:5432/native_codegen
          PRODUCT_VERIFY_PLAYWRIGHT: ${{ github.workspace }}/.native/browser/node_modules/playwright
          PLAYWRIGHT_BROWSERS_PATH: '0'
          REPLAY_PLAN: ${{ runner.temp }}/customer-plan/approved-plan-replay.json
        run: uv run python -m scripts.ci_native_bundled yudao-vben --spec "$REPLAY_PLAN"
      - name: Preserve only bounded sanitized compiler diagnostics
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from scripts.ci_real_model import DiagnosticTextBudget
          root = Path('reports/native')
          budget = DiagnosticTextBudget()
          result = {'source_sha':'${{ github.sha }}','provider_calls':0,'plan_sha256':'dc8c653056be6f68e520668161aa559ba4d3e3325830ad9064922d3f03c743c5','diagnostics':[]}
          progress = root / 'progress.json'
          if progress.is_file():
              value = json.loads(progress.read_text(encoding='utf-8'))
              result['stage'] = value.get('stage')
          for relative in ['generated-build/backend-build.log','baseline/backend-build.log','failure.log']:
              path = root / relative
              if not path.is_file() or path.is_symlink():
                  continue
              for index, line in enumerate(path.read_text(encoding='utf-8',errors='replace').splitlines()):
                  if '[ERROR]' in line or (relative == 'failure.log' and index == 0):
                      excerpt = budget.excerpt(line)
                      if excerpt:
                          result['diagnostics'].append({'file':relative,'line':index+1,'excerpt':excerpt})
          out = Path('reports/customer-replay')
          out.mkdir(parents=True,exist_ok=True)
          (out/'diagnostics.json').write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Upload only replay diagnostics and generated request module
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-yudao-no-model-replay
          path: |
            reports/customer-replay/diagnostics.json
            reports/native/requests-native.zip
          if-no-files-found: warn
          retention-days: 7
