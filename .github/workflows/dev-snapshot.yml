name: Development snapshot
on:
  push:
    branches: [feat/python314-workbench]
    paths: [.github/workflows/dev-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked --all-extras
      - name: Export source and local test runtime without credentials
        shell: bash
        run: |
          mkdir -p /tmp/rnd-snapshot/runtime
          git archive HEAD -o /tmp/rnd-snapshot/source.tar
          PY=$(uv python find --managed-python 3.14)
          ROOT=$(dirname "$(dirname "$(readlink -f "$PY")")")
          cp -a "$ROOT" /tmp/rnd-snapshot/runtime/python
          cp -a .venv/lib/python3.14/site-packages /tmp/rnd-snapshot/runtime/site-packages
          tar -czf /tmp/rnd-snapshot.tar.gz -C /tmp/rnd-snapshot .
      - uses: actions/upload-artifact@v4
        with:
          name: development-snapshot
          path: /tmp/rnd-snapshot.tar.gz
          retention-days: 2
